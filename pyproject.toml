[project]
name = "fmn"
version = "0.1.0"
description = "forget me not v2"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "asgi-lifespan>=2.1.0",
    "fastapi>=0.119.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.12.0",
    "pytest>=8.4.2",
    "pytest-anyio>=0.0.0",
    "pytest-cov>=7.0.0",
    "python-multipart>=0.0.20",
    "traceback-with-variables>=2.2.0",
    "uvicorn>=0.37.0",
]
[tool.pytest.ini_options]
anyio_mode = "auto"
addopts = [
    "--cov=api",
    "--cov-report=term",
    "--import-mode=importlib"
]
[tool.coverage.report]
skip_covered = true
show_missing = true
[tool.ruff]
line-length = 79

